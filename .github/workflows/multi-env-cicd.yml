name: Multi-Environment CI/CD

on:
  push:
    branches: [dev, test, preprod, main]
  pull_request:
    branches: [dev, test, preprod, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: library_ci_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptestpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.x'

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 9.0.0

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Apply EF Core migrations
        env:
          ConnectionStrings__DefaultConnection: "Server=127.0.0.1;Port=3306;Database=library_ci_db;Uid=root;Pwd=testpassword;"
        run: dotnet ef database update --project LibraryManagementSystem.Api

      - name: Run tests
        env:
          ConnectionStrings__DefaultConnection: "Server=127.0.0.1;Port=3306;Database=library_ci_db;Uid=root;Pwd=testpassword;"
        run: dotnet test --configuration Release --no-build

      - name: Publish API
        run: dotnet publish LibraryManagementSystem.Api --configuration Release --no-build --output publish

      - name: Upload publish artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: api-publish-${{ github.ref_name }}
          path: publish

  deploy-dev:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment:
      name: DEV
    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: api-publish-dev
          path: publish

      - name: Set connection string
        run: |
          echo "ConnectionStrings__DefaultConnection=${{ secrets.DB_CONNECTION_STRING }}" >> $GITHUB_ENV

      - name: Deploy
        run: |
          echo "Deploying to environment: DEV"
          echo "Connection string configured: ${ConnectionStrings__DefaultConnection:+(set)}"

      - name: Deployment status
        run: echo "Deployment to DEV completed successfully"

  deploy-test:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    environment:
      name: TEST
    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: api-publish-test
          path: publish

      - name: Set connection string
        run: |
          echo "ConnectionStrings__DefaultConnection=${{ secrets.DB_CONNECTION_STRING }}" >> $GITHUB_ENV

      - name: Deploy
        run: |
          echo "Deploying to environment: TEST"
          echo "Connection string configured: ${ConnectionStrings__DefaultConnection:+(set)}"

      - name: Deployment status
        run: echo "Deployment to TEST completed successfully"

  deploy-preprod:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/preprod'
    runs-on: ubuntu-latest
    environment:
      name: PreProd
    permissions:
      issues: write
    steps:
      - name: Manual approval
        uses: trstringer/manual-approval@v1
        timeout-minutes: 30

      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: api-publish-preprod
          path: publish

      - name: Set connection string
        run: |
          echo "ConnectionStrings__DefaultConnection=${{ secrets.DB_CONNECTION_STRING }}" >> $GITHUB_ENV

      - name: Deploy
        run: |
          echo "Deploying to environment: PreProd"
          echo "Connection string configured: ${ConnectionStrings__DefaultConnection:+(set)}"

      - name: Deployment status
        run: echo "Deployment to PreProd completed successfully"

  deploy-prod:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: PROD
    permissions:
      issues: write
    steps:
      - name: Manual approval
        uses: trstringer/manual-approval@v1
        timeout-minutes: 30

      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: api-publish-main
          path: publish

      - name: Set connection string
        run: |
          echo "ConnectionStrings__DefaultConnection=${{ secrets.DB_CONNECTION_STRING }}" >> $GITHUB_ENV

      - name: Deploy
        run: |
          echo "Deploying to environment: PROD"
          echo "Connection string configured: ${ConnectionStrings__DefaultConnection:+(set)}"

      - name: Deployment status
        run: echo "Deployment to PROD completed successfully"
